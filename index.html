<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="panel panel-left">
      <h2>Add Bookmark</h2>
      <form id="bookmark-form">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="e.g. GitHub" required />
        </div>
        <div class="field">
          <label for="url">URL</label>
          <input type="url" id="url" placeholder="https://example.com" required />
          <span class="error" id="url-error"></span>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <input type="text" id="category" placeholder="e.g. Dev Tools" required />
        </div>
        <button type="submit" id="submit-btn">Save Bookmark</button>
      </form>
    </div>

    <div class="panel panel-right">
      <h2>Saved Bookmarks</h2>
      <ul id="bookmark-list"></ul>
      <p class="empty-state" id="empty-state">No bookmarks yet.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
